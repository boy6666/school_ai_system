server:
  port: 8080

spring:
  application:
    name: edu-agent-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:edu-agent-dev}
        group: ${NACOS_GROUP:edu-agent}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:edu-agent-dev}
        group: ${NACOS_GROUP:edu-agent}
        file-extension: yaml
        refresh-enabled: true
    gateway:
      # 全程不 StripPrefix：下游服务统一以 /api/<service>/... 暴露，与契约约定一致
      routes:
        - id: edu-agent-auth
          uri: lb://edu-agent-auth
          predicates:
            - Path=/api/edu-agent-auth/**
        - id: edu-agent-learning
          uri: lb://edu-agent-learning
          predicates:
            - Path=/api/edu-agent-learning/**
        - id: edu-agent-resource
          uri: lb://edu-agent-resource
          predicates:
            - Path=/api/edu-agent-resource/**
        - id: edu-agent-teacher
          uri: lb://edu-agent-teacher
          predicates:
            - Path=/api/edu-agent-teacher/**
        - id: edu-agent-code
          uri: lb://edu-agent-code
          predicates:
            - Path=/api/edu-agent-code/**
        # ai 是外部 FastAPI 服务，其路由挂在根路径（/chat、/resource/generate…），
        # 故此处例外地 StripPrefix=2（去掉 /api/edu-agent-ai），转成 http://ai:8001/chat。
        # 其余 Java 服务均遵循“不 StripPrefix、统一 /api/<service>/...”约定。
        - id: edu-agent-ai
          uri: http://${AI_HOST:127.0.0.1}:8001
          predicates:
            - Path=/api/edu-agent-ai/**
          filters:
            - StripPrefix=2
  config:
    import:
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 网关鉴权白名单（免 JWT 前缀）已在 Nacos 配置中心：data-id=edu-agent-gateway.yaml, group=edu-agent
#   gateway.auth.whitelist: /api/edu-agent-auth/login,/api/edu-agent-auth/register,/actuator
# SkyWalking：运行时追加 -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.agent.service_name=edu-agent-gateway
