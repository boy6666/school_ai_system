server:
  port: 8080

spring:
  application:
    name: edu-agent-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:edu-agent-local}
        group: ${NACOS_GROUP:edu-agent}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:edu-agent-local}
        group: ${NACOS_GROUP:edu-agent}
        file-extension: yaml
        refresh-enabled: true
    gateway:
      # 全程不 StripPrefix：下游服务统一以 /api/<service>/... 暴露，与契约约定一致
      routes:
        - id: edu-agent-auth
          uri: lb://edu-agent-auth
          predicates:
            - Path=/api/edu-agent-auth/**
        - id: edu-agent-learning
          uri: lb://edu-agent-learning
          predicates:
            - Path=/api/edu-agent-learning/**
        - id: edu-agent-resource
          uri: lb://edu-agent-resource
          predicates:
            - Path=/api/edu-agent-resource/**
        - id: edu-agent-teacher
          uri: lb://edu-agent-teacher
          predicates:
            - Path=/api/edu-agent-teacher/**
        - id: edu-agent-code
          uri: lb://edu-agent-code
          predicates:
            - Path=/api/edu-agent-code/**
        # ai（Python/FastAPI）已与其余服务一致：在 /api/edu-agent-ai/** 下暴露，并注册进 Nacos，
        # 故同样走 lb:// + 不 StripPrefix。此前指向固定 IP 的 http://${AI_HOST}:8001 + StripPrefix=2
        # 已废弃（那条路由依赖 Python 侧挂根路径，且绕过了服务发现，实例换了就得改配置）。
        #
        # 断言逐条枚举、**不用 /api/edu-agent-ai/** 通配**（契约 C5）：内网专用端点
        # /api/edu-agent-ai/code/analyze 只允许 Java 服务经 Feign 直连，过网关必须 404；
        # 一旦改回通配，任何登录学生都能打到该端点。
        - id: edu-agent-ai
          uri: lb://edu-agent-ai
          predicates:
            # 同一断言内多个模式以逗号分隔（OR 关系）
            - Path=/api/edu-agent-ai/health,/api/edu-agent-ai/chat,/api/edu-agent-ai/path/generate,/api/edu-agent-ai/resource/generate,/api/edu-agent-ai/kb/rebuild
      # 全局跨域：浏览器只与网关通信，故 CORS 在网关这一道边界统一处理（各微服务不单独配 CORS）。
      # allowedOrigins 默认 *（仅内部联调；生产用 CORS_ALLOWED_ORIGINS 环境变量收紧为前端域名）。
      # 鉴权用 Bearer JWT（请求头，非 Cookie），故 allowCredentials=false 即可。
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: '${CORS_ALLOWED_ORIGINS:*}'
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: '*'
            allowCredentials: false
  config:
    import:
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}

# 网关鉴权白名单本地兜底：Nacos 未推送配置时也能放行登录/注册/健康检查。
# 推送 edu-agent-gateway.yaml 后，Nacos 中的值会覆盖此处（见 deploy/nacos-config/）。
# 含 /api/edu-agent-ai/health：AI 存活探针经网关访问时不应要求 JWT，否则运维巡检拿不到真实状态。
gateway:
  auth:
    whitelist: /api/edu-agent-auth/login,/api/edu-agent-auth/register,/api/edu-agent-auth/refresh,/api/edu-agent-ai/health,/actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 网关鉴权白名单（免 JWT 前缀）已在 Nacos 配置中心：data-id=edu-agent-gateway.yaml, group=edu-agent
#   gateway.auth.whitelist: /api/edu-agent-auth/login,/api/edu-agent-auth/register,/api/edu-agent-auth/refresh,/api/edu-agent-ai/health,/actuator
# SkyWalking：运行时追加 -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.agent.service_name=edu-agent-gateway
