server:
  port: 8080

spring:
  application:
    name: edu-agent-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: edu-agent-dev
        group: edu-agent
      config:
        server-addr: 127.0.0.1:8848
        namespace: edu-agent-dev
        group: edu-agent
        file-extension: yaml
    gateway:
      # 全程不 StripPrefix：下游服务统一以 /api/<service>/... 暴露，与契约约定一致
      routes:
        - id: edu-agent-auth
          uri: lb://edu-agent-auth
          predicates:
            - Path=/api/edu-agent-auth/**
        - id: edu-agent-learning
          uri: lb://edu-agent-learning
          predicates:
            - Path=/api/edu-agent-learning/**
        - id: edu-agent-resource
          uri: lb://edu-agent-resource
          predicates:
            - Path=/api/edu-agent-resource/**
        - id: edu-agent-teacher
          uri: lb://edu-agent-teacher
          predicates:
            - Path=/api/edu-agent-teacher/**
        - id: edu-agent-code
          uri: lb://edu-agent-code
          predicates:
            - Path=/api/edu-agent-code/**
        - id: edu-agent-ai
          uri: http://127.0.0.1:8001
          predicates:
            - Path=/api/edu-agent-ai/**

# 网关鉴权白名单：免 JWT 即可访问的前缀（登录/注册/健康检查等）
gateway:
  auth:
    whitelist: /api/edu-agent-auth/login,/api/edu-agent-auth/register,/actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info

# SkyWalking：运行时追加 -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.agent.service_name=edu-agent-gateway
