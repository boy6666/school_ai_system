name: CI

# 门禁：仅编译 + 跑单测即可合入 feature/microservice；
# 契约测试（Spring Cloud Contract / Pact）与 前端/AI 流水线在引入后补充。
on:
  push:
    branches: [ feature/microservice ]
  pull_request:
    branches: [ feature/microservice, main, develop ]

jobs:
  build:
    name: Maven Build (compile + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        # 仅编译 + 单测；不启动 Nacos/DB（避免CI依赖外部服务）。
        # 引入 @SpringBootTest 集成测试时需另配 service 容器。
        run: mvn -B -ntp clean verify
