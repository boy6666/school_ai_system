# ============================================================
# EduAgent 本机「基础设施」编排（单环境 local）
# 工作流（方案 B：基础设施容器化 + Java 服务本机 IDE 直跑）：
#   - 中间件跑在 Docker：Nacos / Redis / RabbitMQ / Chroma / AI(FastAPI)。
#   - MySQL：直接复用本机已有的 MySQL（localhost:3306），不在 Docker 里再起一个。
#   - 6 个 Java 服务（gateway + auth/learning/resource/teacher/code）不在本 compose，
#     用 IDE 或终端在本机跑，注册进「同一个」Nacos 命名空间 edu-agent-local 即视为同一内网。
# 用法（在 deploy/ 目录）：
#   ① 本机 MySQL 先建 5 库：mysql -uroot -p < ../database/init-microservice.sql
#   ② docker compose up -d                    # 起 Nacos/Redis/RabbitMQ/Chroma/AI
#   ③ 等 Nacos healthy 后把配置推送配置中心（创建 edu-agent-local 命名空间）：
#      python deploy/push-nacos-config.py
#   ④ 在 IDE 里分别启动 EduAgentGateway / EduAgentAuth / ... 各服务
# 端口均暴露到宿主（localhost）供本机 Java 服务连接：
#   8848 Nacos | 6379 Redis | 5672/15672 RabbitMQ | 8000 Chroma | 8001 AI
# 设计要点：
#   - 不再区分 dev/formal，全部服务统一命名空间 edu-agent-local、profile=local。
#   - DB-per-service：5 个逻辑库（auth/learning/resource/teacher/code_db）都在本机 MySQL，
#     库由 init-microservice.sql 创建，表由各自的 Flyway 迁移脚本建。
# ============================================================

name: edu-agent

networks:
  edu-agent-net:
    driver: bridge

services:
  # ───────────── Nacos（服务发现 + 配置中心，standalone）─────────────
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: edu-agent-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"   # HTTP 控制台/API
      - "9848:9848"   # gRPC 客户端端口（Nacos 2.x 必需，=8848+1000）
      - "9849:9849"   # gRPC 服务端端口（可选）
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [edu-agent-net]

  # ───────────── Redis ─────────────
  redis:
    image: redis:7
    container_name: edu-agent-redis
    ports:
      - "6379:6379"
    networks: [edu-agent-net]

  # ───────────── RabbitMQ ─────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: edu-agent-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [edu-agent-net]

  # ───────────── Chroma（向量库，供 AI/RAG）─────────────
  chroma:
    image: ghcr.io/chroma-core/chroma:0.5.5
    container_name: edu-agent-chroma
    ports:
      - "8000:8000"
    networks: [edu-agent-net]

  # ───────────── AI（Python/FastAPI，本机跑 Java 服务时经 http://localhost:8001 调用）─────────────
  ai:
    build:
      context: ../edu-agent-ai
      dockerfile: Dockerfile
    container_name: edu-agent-ai
    ports:
      - "8001:8001"
    environment:
      USE_MOCK_LLM: "1"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      - chroma
    restart: unless-stopped
    networks: [edu-agent-net]
