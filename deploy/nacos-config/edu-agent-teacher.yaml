spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/teacher_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USER:edu_agent}
    password: ${DB_PASSWORD:edu_agent}
  # 表结构由 Flyway 版本化迁移自动管理（脚本见 edu-agent-teacher/src/main/resources/db/migration/），无需手动建表
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: 5672
    username: ${MQ_USER:guest}
    password: ${MQ_PASSWORD:guest}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 健康检查暴露：/actuator/health 供存活/就绪探针（k8s liveness/readiness）与运维巡检。
# probes.enabled=true 额外暴露 /actuator/health/liveness 与 /actuator/health/readiness。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    probes:
      enabled: true
