spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/auth_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  # 表结构由 Flyway 版本化迁移自动管理（脚本见 edu-agent-auth/src/main/resources/db/migration/），无需手动建表
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: 5672
    username: ${MQ_USER:guest}
    password: ${MQ_PASSWORD:guest}

edu-agent:
  jwt:
    # 由各环境的运行时环境变量 JWT_SECRET 注入；Linux 联调务必覆盖为强随机值
    secret: ${JWT_SECRET:edu-agent-dev-secret-please-change}
    expiration: 86400000
  auth:
    bootstrap:
      # 首次启动为 admin 账户设置的口令；正式环境通过部署环境变量 AUTH_BOOTSTRAP_ADMIN_PASSWORD 覆盖为强口令
      admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:admin123}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 健康检查暴露：/actuator/health 供存活/就绪探针（k8s liveness/readiness）与运维巡检。
# probes.enabled=true 额外暴露 /actuator/health/liveness 与 /actuator/health/readiness。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    probes:
      enabled: true
