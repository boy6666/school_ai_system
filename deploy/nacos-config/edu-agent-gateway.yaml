# 网关鉴权白名单：免 JWT 即可访问的前缀（登录 / 注册 / 健康检查等）
gateway:
  auth:
    whitelist: /api/edu-agent-auth/login,/api/edu-agent-auth/register,/api/edu-agent-auth/refresh,/actuator

# JWT 验签密钥：必须与 auth 签发端完全一致，否则网关验签失败返回 401「未认证或令牌无效」
edu-agent:
  jwt:
    secret: ${JWT_SECRET:edu-agent-local-secret-please-change}
