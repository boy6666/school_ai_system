server:
  port: 8085

spring:
  application:
    name: edu-agent-code
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: edu-agent-dev
        group: edu-agent
      config:
        server-addr: 127.0.0.1:8848
        namespace: edu-agent-dev
        group: edu-agent
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/code_db?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

# SkyWalking：运行时追加 -javaagent:/opt/skywalking/agent/skywalking-agent.jar -Dskywalking.agent.service_name=edu-agent-code
